# docker/nginx/prod.conf
#
# Mini CRM — production nginx (container: web).
# Plain HTTP only: TLS is terminated by Caddy in front of this container.
# Serves public/ and forwards PHP requests to php-fpm in the app container.
#
# Author  : Xgenious (https://xgenious.com)
# License : MIT

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    # Hashed build assets and images: cache for 30 days
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
