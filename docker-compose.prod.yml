# docker-compose.prod.yml
#
# Mini CRM — production stack for a single AWS EC2 server.
# Services: caddy (HTTPS + Let's Encrypt), web (nginx), app (PHP-FPM),
#           worker (queue), scheduler (cron), mysql, redis.
#
# Only ports 80 and 443 are published. MySQL and Redis stay private to the Docker network.
#
# Configuration: the real production values live in ./.env on the server (never in git).
# See .env.production.example for every key this file reads.
#
# Deploy steps: see docs/deployment/aws.md
#
# Author  : Xgenious (https://xgenious.com)
# License : MIT

name: mini-crm-prod

x-app-common: &app-common
  image: mini-crm:prod
  build:
    context: .
    dockerfile: Dockerfile
    target: production
  restart: always
  volumes:
    # Laravel reads .env from its root; mount the server's file read-only.
    - ./.env:/var/www/html/.env:ro
    - storage_data:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
  networks:
    - crm

services:
  app:
    <<: *app-common
    # PHP-FPM only; nginx reaches it as app:9000 on the internal network.

  web:
    image: mini-crm-web:prod
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: always
    volumes:
      # nginx serves uploaded files (logo, favicon) from the same storage volume.
      - storage_data:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - crm

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env, e.g. crm.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - crm

  worker:
    <<: *app-common
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *app-common
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - crm

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - crm

networks:
  crm:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
