<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" fill="none" role="img" aria-label="CRM dashboard illustration">
  <!-- Mini CRM auth hero illustration · Xgenious · MIT -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1b4b" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- background blobs -->
  <circle cx="400" cy="70" r="70" fill="#fff" opacity=".06"/>
  <circle cx="60" cy="340" r="90" fill="#fff" opacity=".05"/>

  <!-- main window -->
  <g filter="url(#sh)">
    <rect x="60" y="60" width="330" height="230" rx="18" fill="#fff"/>
    <rect x="60" y="60" width="330" height="38" rx="18" fill="#eef2ff"/>
    <rect x="60" y="80" width="330" height="18" fill="#eef2ff"/>
    <circle cx="84" cy="79" r="5" fill="#f87171"/>
    <circle cx="100" cy="79" r="5" fill="#fbbf24"/>
    <circle cx="116" cy="79" r="5" fill="#34d399"/>
    <rect x="150" y="73" width="140" height="12" rx="6" fill="#e0e7ff"/>

    <!-- stat chips -->
    <rect x="80" y="114" width="90" height="48" rx="10" fill="#eef2ff"/>
    <rect x="92" y="126" width="40" height="7" rx="3.5" fill="#a5b4fc"/>
    <rect x="92" y="140" width="56" height="11" rx="5.5" fill="#4f46e5"/>
    <rect x="180" y="114" width="90" height="48" rx="10" fill="#ecfdf5"/>
    <rect x="192" y="126" width="40" height="7" rx="3.5" fill="#6ee7b7"/>
    <rect x="192" y="140" width="48" height="11" rx="5.5" fill="#059669"/>
    <rect x="280" y="114" width="90" height="48" rx="10" fill="#fff7ed"/>
    <rect x="292" y="126" width="40" height="7" rx="3.5" fill="#fdba74"/>
    <rect x="292" y="140" width="60" height="11" rx="5.5" fill="#ea580c"/>

    <!-- bar chart -->
    <rect x="80" y="176" width="190" height="96" rx="10" fill="#f8fafc"/>
    <rect x="96"  y="232" width="16" height="28" rx="4" fill="url(#bar)"/>
    <rect x="122" y="214" width="16" height="46" rx="4" fill="url(#bar)"/>
    <rect x="148" y="222" width="16" height="38" rx="4" fill="url(#bar)"/>
    <rect x="174" y="198" width="16" height="62" rx="4" fill="url(#bar)"/>
    <rect x="200" y="206" width="16" height="54" rx="4" fill="url(#bar)"/>
    <rect x="226" y="188" width="16" height="72" rx="4" fill="url(#bar)"/>
    <polyline points="104,226 130,208 156,214 182,192 208,200 234,182" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- contact list -->
    <rect x="280" y="176" width="90" height="96" rx="10" fill="#f8fafc"/>
    <circle cx="296" cy="196" r="8" fill="#c7d2fe"/>
    <rect x="310" y="192" width="46" height="8" rx="4" fill="#e2e8f0"/>
    <circle cx="296" cy="224" r="8" fill="#bbf7d0"/>
    <rect x="310" y="220" width="40" height="8" rx="4" fill="#e2e8f0"/>
    <circle cx="296" cy="252" r="8" fill="#fed7aa"/>
    <rect x="310" y="248" width="50" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- floating deal card -->
  <g filter="url(#sh)">
    <rect x="300" y="250" width="150" height="86" rx="14" fill="#fff"/>
    <circle cx="326" cy="276" r="12" fill="#dcfce7"/>
    <path d="M320 276l4 4 8-8" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="346" y="268" width="80" height="8" rx="4" fill="#334155"/>
    <rect x="346" y="281" width="54" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="316" y="302" width="118" height="8" rx="4" fill="#e0e7ff"/>
    <rect x="316" y="302" width="86" height="8" rx="4" fill="#6366f1"/>
    <rect x="316" y="316" width="50" height="7" rx="3.5" fill="#cbd5e1"/>
  </g>

  <!-- floating avatar card -->
  <g filter="url(#sh)">
    <rect x="20" y="210" width="120" height="64" rx="14" fill="#fff"/>
    <circle cx="48" cy="242" r="16" fill="#6366f1"/>
    <circle cx="48" cy="237" r="6" fill="#e0e7ff"/>
    <path d="M37 252c2-6 6-8 11-8s9 2 11 8" fill="#e0e7ff"/>
    <rect x="72" y="232" width="52" height="8" rx="4" fill="#334155"/>
    <rect x="72" y="246" width="36" height="7" rx="3.5" fill="#cbd5e1"/>
  </g>

  <!-- sparkles -->
  <path d="M420 170l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#fde68a"/>
  <path d="M40 120l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff" opacity=".7"/>
</svg>
